[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcs-backend"
version = "0.1.0"
description = "Ground Control Station backend (FastAPI + ROS2)"
readme = "../README.md"
requires-python = ">=3.10,<3.12"
license = { file = "../LICENSE.txt" }
authors = [{ name = "Ground Control Station Team" }]
dependencies = [
    "fastapi==0.122.0",
    "uvicorn[standard]==0.38.0",
    "pydantic==2.12.4",
    "pydantic-settings>=2.6.0",
    "python-multipart==0.0.20",
    "structlog>=24.4.0",
    "numpy>=1.26.0,<2.0",
]

# ROS2 message packages (geometry_msgs, nav_msgs, sensor_msgs, std_msgs) are
# intentionally NOT listed here. They come from the system via apt:
#   sudo apt install ros-humble-common-interfaces
# Pip-installed ROS msg packages diverge from the system ROS runtime and
# cause silent serialization mismatches.

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
gcs-backend = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─── Ruff (lint + format) ───────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "ros_nodes/build", "ros_nodes/install", "ros_nodes/log"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # flake8-bugbear
    "C4",          # flake8-comprehensions
    "SIM",         # flake8-simplify
    "RUF",         # ruff-specific
    "ASYNC",       # flake8-async
    "PL",          # pylint
]
ignore = [
    "E501",        # line-too-long (formatter handles this)
    "PLR0913",     # too-many-arguments
    "PLR2004",     # magic-value-comparison
    "PLC0415",     # import-outside-top-level (intentional for ROS fallback)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ─── Mypy ───────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["ros_nodes/build", "ros_nodes/install", "ros_nodes/log", "data"]

[[tool.mypy.overrides]]
module = [
    "rclpy.*",
    "geometry_msgs.*",
    "nav_msgs.*",
    "sensor_msgs.*",
    "std_msgs.*",
]
ignore_missing_imports = true

# ─── Pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["*/tests/*", "*/ros_nodes/build/*", "*/ros_nodes/install/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
